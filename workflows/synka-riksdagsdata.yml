name: Synka riksdagsdata

on:
  workflow_dispatch:
  schedule:
    - cron: '32 5 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hämta och validera riksdagsdata
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/sync_riksdagen.py
      - name: Spara verifierad datafil
        run: |
          git config user.name 'politikdata-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/riksdag.json
          if ! git diff --cached --quiet; then
            git commit -m 'Uppdatera riksdagsvoteringar från öppna data'
            git push
          fi
